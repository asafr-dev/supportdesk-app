services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    working_dir: /workspaces/supportdesk-app
    volumes:
      - ..:/workspaces/supportdesk-app:cached
    command: sleep infinity
    environment:
      # In-devcontainer DB connection (no code branching)
      DATABASE_URL: postgresql://app:app@db:5432/supportdesk
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: supportdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d supportdesk"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
